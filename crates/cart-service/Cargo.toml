# SPDX-License-Identifier: MIT

[package]
name = "cart-service"
description = "The cart-service binary: the Rust port of gluon's Scala cart-service (ADR 0029)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
redis-cache = { path = "../../../../lib/gluon-rs/crates/redis-cache" }
service-basics = { path = "../../../../lib/gluon-rs/crates/service-basics" }
telemetry = { path = "../../../../lib/gluon-rs/crates/telemetry" }
axum = "0.8"
schemars = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["macros", "net", "sync"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
time = { version = "0.3", features = ["macros"] }
service-testing = { path = "../../../../lib/gluon-rs/crates/service-testing" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
