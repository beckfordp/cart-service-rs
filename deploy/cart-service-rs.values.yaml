# SPDX-License-Identifier: MIT
# Copy to gluon environments/local/cart-service-rs.values.yaml: the Rust
# cart-service, installed by bin/k8s-local-up under the same release name
# when its <SVC>_IMPL=rust. The same env vars as cart-service.values.yaml (copy
# them from there); the chart's JVM-only settings blanked.
image:
  repository: cart-service-rs
  tag: latest

javaOpts: ""
mallocArenaMax: ""

env:
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: http://tempo:4318
  - name: POSTGRES_HOST
    value: cart-postgres
  - name: POSTGRES_DB
    value: cart
  - name: POSTGRES_USER
    value: cart
  - name: POSTGRES_PASSWORD
    value: cart
